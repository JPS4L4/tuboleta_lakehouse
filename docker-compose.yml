services:
  cockroach:
    image: cockroachdb/cockroach:v25.4.0
    container_name: tuboleta-cockroach
    command: start-single-node --insecure --http-addr=0.0.0.0:8080 --store=/cockroach/cockroach-data
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  cockroach-data:
